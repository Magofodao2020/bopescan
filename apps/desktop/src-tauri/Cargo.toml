# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.

[package]
name = "bope-desktop"
description = "B.O.P.E Scanner desktop app (Tauri 2), a modified version of aeterna-rongroi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bope-scanner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
jiff.workspace = true
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
bope-collectors.workspace = true
bope-core.workspace = true
bope-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
# `FixtureHost`, for the tests that remove profile folders left by earlier runs.
bope-host = { workspace = true, features = ["fixture"] }

[target.'cfg(windows)'.dependencies]
bope-host-windows.workspace = true

[lints]
workspace = true
