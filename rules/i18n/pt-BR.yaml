926b3863-8f4f-4d18-aab6-26b77934466e:
  title: "O change journal tem uma exclusão na pasta de histórico de comandos do PowerShell"
  description: >-
    O change journal do NTFS guarda pelo menos um registro de arquivo apagado diretamente dentro da
    pasta em que o PowerShell guarda o histórico de comandos digitados na janela dele. O PowerShell
    acrescenta a esse arquivo e o regrava, mas não o apaga, então uma exclusão ali foi feita por uma
    pessoa ou por outro programa. A linha dá quantos registros e a primeira e a última vez, nunca um
    nome de arquivo nem o que o arquivo continha. Mostra o intervalo que o journal cobria: num PC comum
    em uso isso pode ser bem menos de uma hora. Nada antes desse intervalo é visto, e uma pasta
    apagada, em vez de um arquivo dentro dela, não é contada. Se esta regra não encontra nada,
    significa só que nada foi apagado ali nesse intervalo. O journal não registra qual programa apagou
    um arquivo, então isto não diz quem fez nem que algo foi escondido.
  retention: >-
    Só o intervalo que o change journal ainda guardava quando a verificação o leu, mostrado ao lado
    desta linha. O journal tem tamanho fixo e descarta primeiro os registros mais antigos; num PC com
    Windows 11 ele guardava cerca de 39 minutos.
  falsepositives:
    - "O jogador limpando o próprio histórico do PowerShell, o que apaga o arquivo"
    - "Uma ferramenta de privacidade, limpeza ou otimização que limpa históricos de comandos"
    - "Uma redefinição de perfil do Windows, ou uma ferramenta de backup ou sincronização restaurando a pasta"
    - "Antivírus removendo um arquivo da pasta"
8a39617a-30d6-4fc0-9b20-cb4f899985d5:
  title: "O change journal tem uma renomeação na pasta de histórico de comandos do PowerShell"
  description: >-
    O change journal do NTFS guarda pelo menos um registro de arquivo renomeado diretamente dentro da
    pasta em que o PowerShell guarda o histórico de comandos digitados na janela dele, movido para
    dentro dela ou para fora dela. Uma renomeação dentro da pasta deixa dois registros, um com o nome
    antigo e um com o novo. O PowerShell acrescenta ao arquivo de histórico e o regrava, mas não o
    renomeia. A linha dá quantos registros e a primeira e a última vez, nunca um nome de arquivo nem o
    que o arquivo continha. Mostra o intervalo que o journal cobria: num PC comum em uso isso pode ser
    bem menos de uma hora. Nada antes desse intervalo é visto. Se esta regra não encontra nada,
    significa só que nada foi renomeado, movido para dentro ou para fora ali nesse intervalo. O journal
    não registra qual programa renomeou um arquivo, então isto não diz quem fez nem que algo foi
    escondido.
  retention: >-
    Só o intervalo que o change journal ainda guardava quando a verificação o leu, mostrado ao lado
    desta linha. O journal tem tamanho fixo e descarta primeiro os registros mais antigos; num PC com
    Windows 11 ele guardava cerca de 39 minutos.
  falsepositives:
    - "O jogador movendo o arquivo de histórico para guardar ou compartilhar, ou trazendo-o de volta"
    - "Um arquivo movido para a Lixeira, que o journal registra como renomeação (como a Lixeira aparece não foi medido)"
    - "Um editor de texto que salva gravando uma cópia nova e renomeando-a por cima da antiga"
    - "Uma ferramenta de backup, sincronização ou limpeza substituindo o arquivo"
82c71896-ef70-492d-b6fc-8671c09b5e1c:
  title: "Quando o change journal registrou mudanças numa pasta observada"
  description: >-
    Coloca na linha do tempo a mudança mais antiga e a mais nova que o change journal do NTFS ainda
    guarda para cada pasta que este programa observa: Prefetch, a pasta de logs de eventos, a pasta do
    Program Compatibility Assistant, as pastas de plugins do FiveM e a pasta em que o PowerShell guarda
    o histórico de comandos. O journal conta mudanças sem dizer qual programa as fez, então um horário
    aqui é quando um arquivo dessa pasta foi criado, alterado, renomeado ou apagado, por qualquer um,
    incluindo o Windows e o FiveM; na pasta do PowerShell uma mudança geralmente é um comando digitado
    numa janela do PowerShell, nunca qual comando. Não é evidência de que algo foi removido.
  retention: >-
    Só os registros que o journal ainda guarda. O journal tem tamanho fixo e descarta os registros
    mais antigos conforme chegam novos, então só alcança o passado até onde o tamanho permite.
  falsepositives:
    - "O Windows gravando e removendo arquivos de Prefetch, logs de eventos e registros de compatibilidade no uso normal"
    - "O FiveM, seu atualizador e plugins instalados ou removidos pelo jogador alterando arquivos nas pastas de plugins"
    - "O PowerShell acrescentando cada comando digitado na janela ao arquivo de histórico"
    - "Ferramentas de limpeza de disco, backup, antivírus e otimização"
    - "Uma pasta sem mudança no intervalo do journal não tem horário aqui, o que não significa que nada mudou antes dele"
fe57aa65-11b0-4e1f-b81c-a4fda597855b:
  title: "O Windows iniciou após um desligamento com Inicialização Rápida"
  description: >-
    Coloca na linha do tempo cada início do Windows que o log System registra com tipo de boot 1, o
    que foi medido depois de um desligamento com Inicialização Rápida ligada, o padrão. Um dispositivo
    retirado com o Windows desligado desta forma tem um horário de remoção, gravado durante o
    desligamento, e o início do Windows não regrava os horários de chegada dele.
  retention: >-
    Enquanto o log System mantiver seus registros: por padrão ele sobrescreve os mais antigos ao
    atingir o tamanho máximo.
  falsepositives:
    - "A Inicialização Rápida vem ligada por padrão, então a maioria dos desligamentos pelo menu Iniciar termina assim"
fa3e721e-98f2-4007-bbd8-133208564682:
  title: "O Windows iniciou após desligamento completo ou reinício"
  description: >-
    Coloca na linha do tempo cada início do Windows que o log System registra com tipo de boot 0, o
    que foi medido depois de um desligamento completo e depois de uma reinicialização. Um dispositivo
    retirado com o Windows desligado desta forma não tem horário de remoção; o último início em que
    estava presente é tudo o que o Windows guarda sobre quando ele saiu.
  retention: >-
    Enquanto o log System mantiver seus registros: por padrão ele sobrescreve os mais antigos ao
    atingir o tamanho máximo.
  falsepositives:
    - "Todo PC inicia assim; um início é um ponto de referência para os outros horários, não um achado"

e3f5c638-81e3-410a-9f1d-fe762b9f8731:
  title: "O SRUM registrou uso de CPU por um programa com nome de executor ou injetor do Roblox"
  description: >-
    O banco do Monitor de Uso de Recursos do Sistema (SRUDB.dat, lido de uma shadow copy já existente)
    tem linhas dizendo que um programa cujo nome de arquivo corresponde a um executor ou injetor do
    Roblox usou tempo de CPU, com a primeira e a última hora registradas. O SRUM grava mais ou menos
    uma vez por hora, então os horários são horas, não inícios. Um nome não prova o que o programa
    era, e o banco não tem o que o SRUM ainda não tinha gravado quando a shadow copy foi criada.
  retention: >-
    O SRUM guarda cerca de 30 a 60 dias de linhas por hora; a shadow copy tem a idade do snapshot, e
    nada posterior a ele está na cópia.
  falsepositives:
    - "Um programa sem relação que tem o mesmo nome de arquivo, como um jogo ou utilitário chamado Solara ou Wave"
    - "Um arquivo renomeado com o nome de uma ferramenta por alguém testando este scanner"

d600c6da-1da8-44b5-9e47-24c56cf01558:
  title: "Horas em que o SRUM registrou programas com nome de ferramentas Roblox"
  description: >-
    Coloca na linha do tempo a primeira e a última hora em que o Monitor de Uso de Recursos do Sistema
    registrou um programa cujo nome corresponde ao catálogo de ferramentas Roblox.
  retention: >-
    O SRUM guarda cerca de 30 a 60 dias de linhas por hora.
  falsepositives:
    - "O horário é a hora em que o SRUM gravou os números, não quando o programa começou; um nome não identifica um programa"

d615135a-756a-4da8-ae18-ef2737a3e921:
  title: "A Master File Table guarda um registro liberado com nome de executor ou injetor do Roblox"
  description: >-
    Um registro da Master File Table do volume do sistema que o NTFS marcou como fora de uso ainda
    guarda o nome de um arquivo ou pasta que corresponde a um executor ou injetor do Roblox, com o
    caminho da pasta e os horários do NTFS. São os metadados de uma entrada excluída; o conteúdo não é
    recuperado nem lido, o registro pode ser reutilizado a qualquer momento, e um nome não prova o que
    era o arquivo nem que ele foi executado.
  retention: >-
    Um registro liberado dura até o NTFS reutilizá-lo para um arquivo novo: horas num volume
    movimentado, meses num volume parado.
  falsepositives:
    - "Um download apagado sem ter sido aberto, ou um antivírus que pôs o arquivo em quarentena e o removeu"
    - "Um arquivo sem relação com o mesmo nome, apagado por qualquer motivo"

59259bcb-c00a-46fa-897d-40b4ef75ea99:
  title: "Horários NTFS de registros da Master File Table com nome de ferramentas Roblox"
  description: >-
    Coloca na linha do tempo os horários de criação e de última gravação que o NTFS guarda em
    registros da Master File Table cujos nomes correspondem ao catálogo de ferramentas Roblox, em uso
    ou liberados.
  retention: >-
    Um registro liberado dura até o NTFS reutilizá-lo.
  falsepositives:
    - "Esses horários podem ser definidos por programas que copiam ou extraem arquivos; um nome não identifica um programa"

1a7a3594-5b68-4142-8426-96aa0e0a2e90:
  title: "O Explorer lembra de ter aberto uma pasta com nome de executor ou injetor do Roblox"
  description: >-
    As ShellBags da conta guardam o caminho de uma pasta com um trecho que corresponde a um executor
    ou injetor do Roblox: o Explorer salvou a exibição dessa pasta em algum momento. A pasta pode ter
    sido apagada, renomeada ou estar num disco que não está mais conectado. Abrir uma pasta não é
    executar um programa.
  retention: >-
    As ShellBags duram até o perfil da conta ser apagado ou o histórico ser limpo; o Windows guarda
    milhares de pastas.
  falsepositives:
    - "Uma pasta com nome comum que corresponde, como um álbum de fotos chamado Wave ou Solara"
    - "Olhar o conteúdo de um arquivo compactado ou de uma pasta compartilhada por outra pessoa sem executar nada"

600956be-c11f-43de-9070-02ceea97461c:
  title: "A caixa Abrir/Salvar lembra de um arquivo com nome de executor ou injetor do Roblox"
  description: >-
    A lista da caixa de diálogo comum Abrir/Salvar (OpenSavePidlMRU) guarda um caminho cujo nome de
    arquivo ou pasta corresponde a um executor ou injetor do Roblox: algum programa usou a caixa para
    abri-lo ou salvá-lo. Não prova que o arquivo foi executado, nem qual programa usou a caixa.
  retention: >-
    A lista guarda cerca das 20 últimas entradas por extensão até o histórico ser limpo.
  falsepositives:
    - "Enviar ou anexar um arquivo com esse nome num navegador ou programa de chat"
    - "Um arquivo sem relação com o mesmo nome"

7a7cebaa-f0ae-4e82-9234-4b53f853eacb:
  title: "Uma assinatura WMI permanente executa uma linha de comando ou um script"
  description: >-
    O WMI tem um CommandLineEventConsumer ou ActiveScriptEventConsumer que não é um dos que vêm com o
    Windows: quando o filtro de evento dispara, o Windows inicia o programa ou executa o script
    sozinho, sem usuário conectado. A linha mostra o programa, o arquivo de script ou os arquivos
    citados pelo script, e o hash e a assinatura deles quando existem; o texto do script e os
    argumentos do comando nunca são guardados. É uma forma de iniciar algo de modo persistente, não
    prova do que é iniciado.
  retention: >-
    Uma assinatura dura até ser apagada; o repositório do WMI sobrevive a reinicializações.
  falsepositives:
    - "Software de fabricante e de gerenciamento (utilitários Dell, HP, Lenovo, agentes SCCM/Intune) que usam assinaturas WMI"
    - "Scripts de manutenção criados pelo departamento de TI ou pelo dono do PC"

2a0c35e1-7d5e-425e-a0f7-99424e7973ec:
  title: "Uma assinatura WMI permanente cita um executor ou injetor do Roblox"
  description: >-
    O nome, o programa, o arquivo de script ou os arquivos citados pelo script de um consumidor de
    eventos do WMI correspondem a um executor ou injetor do Roblox. O Windows iniciaria isso sozinho
    sempre que o evento da assinatura acontecesse. Um nome não prova o que é o programa.
  retention: >-
    Uma assinatura dura até ser apagada.
  falsepositives:
    - "Um programa sem relação com o mesmo nome, iniciado pela assinatura WMI de um fabricante"

40126502-5a4c-421d-9603-522ea7152433:
  title: "Um arquivo compactado em Downloads, Área de Trabalho ou Temp esconde os nomes internos (cabeçalhos criptografados)"
  description: >-
    Um arquivo .rar ou .7z num local que esta verificação lista tem cabeçalhos criptografados, então
    nem os nomes dentro dele podem ser lidos sem a senha. Nada lá dentro foi examinado; isto diz
    apenas que o conteúdo não pôde ser verificado.
  retention: >-
    O arquivo compactado como está no momento da verificação.
  falsepositives:
    - "Qualquer arquivo compactado com senha: backups, documentos enviados pelo trabalho ou pela escola, mods de jogos"
