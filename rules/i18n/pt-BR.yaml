    diz nada.
  retention: >-
    Só as linhas que o arquivo de histórico do PowerShell ainda guarda. Ele mantém os 4096 comandos
    mais novos por padrão e não grava horário por linha, então a linha diz há quantos comandos, não
    quando. O PowerShell deixa fora do arquivo toda linha com as palavras password, token, key ou
    secret.
  falsepositives:
    - "Scripts de limpeza e otimização que limpam logs e Prefetch num clique, comuns entre jogadores"
    - "Uma pessoa limpando o próprio histórico de comandos"
    - "Administradores redefinindo um log durante testes"
    - "A falta da linha não significa que nada foi limpo, porque outras ferramentas não deixam linha aqui"
    - "Uma verificação reiniciada com a senha de outro administrador, que lê o histórico desse administrador, não o de quem está no teclado; cada linha então diz `account: other`"
bc3c9769-c57e-4c01-9f0d-8a71152102ec:
  title: "Quando os logs do PowerShell registraram um comando que baixou algo e executou"
  description: >-
    Coloca na linha do tempo a primeira e a última vez que um bloco de script marcado ou um início do
    Windows PowerShell tinha tanto uma palavra que baixa quanto uma que executa texto como comando. O
    histórico não tem horários e não está na linha do tempo. Esta ferramenta lê o comando só para
    classificar suas palavras em tipos e não guarda texto dele, então a linha diz que tipo de palavras
    ele tinha, nunca qual comando, o que executou nem se funcionou. Uma palavra montada de outra forma
    que não os escapes comuns do PowerShell não é reconhecida, então a falta da linha não diz nada.
  retention: >-
    Só os registros que os dois logs do Windows PowerShell ainda guardam; cada um mantém 15 MiB por
    padrão e sobrescreve os registros mais antigos quando enche.
  falsepositives:
    - "Instaladores e scripts de atualização que baixam e executam numa linha"
    - "A falta de horário não significa que nada rodou, e nenhum horário anterior ao registro mais antigo de um log é visto"
    - "Uma política que desliga o registro de blocos de script, que as linhas de postura do PowerShell mostram: nenhum bloco marcado é gravado, e só os inícios do Windows PowerShell podem pôr um horário aqui"
7d493537-7ecf-4f97-90a0-119e079d30d2:
  title: "Um arquivo do Prefetch está marcado como somente leitura"
  description: >-
    Um arquivo na pasta Prefetch do Windows tem o atributo somente leitura. O Windows grava e regrava
    esses arquivos ele mesmo, e na única máquina Windows 11 que este projeto mediu nenhum deles tinha o
    atributo. Esta linha mostra o arquivo e o que ele registra. Não diz quem definiu o atributo, quando
    ou por quê, e não é evidência de que algo foi escondido nem de que o programa citado foi usado para
    trapacear.
  retention: >-
    O atributo como está no momento da verificação, nos arquivos de Prefetch ainda na pasta. Não diz
    nada sobre quando foi definido nem sobre arquivos que foram removidos.
  falsepositives:
    - "Somente leitura escolhido nas Propriedades da pasta Prefetch ou de uma pasta acima, que o Windows aplica aos arquivos dentro"
    - "Arquivos copiados ou restaurados na pasta por software de backup, imagem ou cópia que mantém atributos, como o robocopy do próprio Windows faz por padrão"
d377e008-0a08-4d6e-adf2-f6cbc8b978db:
  title: "Quando o Prefetch registrou um programa com nome do processo de jogo do FiveM"
  description: >-
    Coloca na linha do tempo o horário que o Prefetch do Windows registrou para um programa chamado
    FiveM_b<número>_GTAProcess.exe, o nome que o FiveM dá ao processo do jogo que inicia, com a build
    do jogo no lugar de <número>. O registro guarda um nome, não qual programa era, então isto mostra
    quando um programa com esse nome rodou segundo este registro, não que o FiveM ou o GTA V rodou. Não
    é evidência de nada, e a falta de uma entrada não significa que o jogo nunca rodou.
  retention: >-
    Só os arquivos de Prefetch ainda na pasta, e só a execução mais recente que cada um registra. O
    Windows remove arquivos de Prefetch sozinho, e um PC com o Prefetch desligado não tem nenhum.
  falsepositives:
    - "Qualquer programa cujo nome comece com FiveM_b e termine com _GTAProcess.exe — o registro guarda um nome e nada que identifique o programa, então um programa renomeado nesse formato é registrado com esse nome"
    - "Um programa com outro nome não é selecionado, seja ele qual for, então a falta de entrada não significa que nada rodou"
    - "O Windows não gravar ou não manter um registro — Prefetch desligado, um arquivo de Prefetch que o Windows removeu, ou uma pasta esvaziada por uma ferramenta de limpeza"
    - "O Windows manter o registro depois que os arquivos do programa foram removidos"
a81a1693-2982-4004-8f40-186c2b90a6a2:
  title: "Quando o Prefetch registrou um programa com nome de FiveM ou GTA V"
  description: >-
    Coloca na linha do tempo o horário que o Prefetch do Windows registrou para um programa chamado
    FiveM.exe, GTA5.exe, GTA5_Enhanced.exe ou PlayGTAV.exe, os nomes que o FiveM e o GTA V dão aos seus
    executáveis. O registro guarda um nome, não qual programa era, então isto mostra quando um programa
    com esse nome rodou segundo este registro, não que o FiveM ou o GTA V rodou. Não é evidência de
    nada, e a falta de uma entrada não significa que o jogo nunca rodou.
  retention: >-
    Só os arquivos de Prefetch ainda na pasta, e só a execução mais recente que cada um registra. O
    Windows remove arquivos de Prefetch sozinho, e um PC com o Prefetch desligado não tem nenhum.
  falsepositives:
    - "Qualquer programa com um desses nomes — o registro guarda um nome e nada que identifique o programa, então um programa renomeado para um deles é registrado com esse nome"
    - "Um programa com outro nome não é selecionado, seja ele qual for, então a falta de entrada não significa que nada rodou"
    - "O Windows não gravar ou não manter um registro — Prefetch desligado, um arquivo de Prefetch que o Windows removeu, ou uma pasta esvaziada por uma ferramenta de limpeza"
    - "O Windows manter o registro depois que os arquivos do programa foram removidos"
1c73241b-b7f1-4f91-81d4-8de53db6d119:
  title: "O change journal tem uma exclusão na pasta asi do FiveM para GTA V Enhanced"
  description: >-
    O change journal do NTFS guarda pelo menos um registro de arquivo apagado diretamente dentro da
    pasta asi do FiveM para GTA V Enhanced. A linha dá quantos registros e a primeira e a última vez.
    Mostra o intervalo que o journal cobria: num PC comum em uso isso pode ser bem menos de uma hora.
    Nada antes desse intervalo é visto. Se esta regra não encontra nada, significa só que nada foi
    apagado ali dentro desse intervalo. O journal não registra qual programa alterou um arquivo, então
    isto não diz quem fez nem que algo foi escondido. Não está estabelecido se o FiveM para GTA V
    Enhanced carrega algo desta pasta.
  retention: >-
    Só o intervalo que o change journal ainda guardava quando a verificação o leu, mostrado ao lado
    desta linha. O journal tem tamanho fixo e descarta primeiro os registros mais antigos; num PC com
    Windows 11 ele guardava cerca de 39 minutos.
  falsepositives:
    - "O jogador removeu ou substituiu um mod gráfico, ReShade, ENB ou outro plugin que tinha instalado"
    - "O FiveM ou seu atualizador substituiu ou removeu um arquivo da pasta (não medido para esta pasta)"
    - "Uma ferramenta de limpeza, de \"limpar cache do FiveM\" ou otimização que esvazia as pastas do FiveM"
    - "Antivírus colocando um arquivo em quarentena ou removendo-o"
    - "O FiveM reinstalado, ou a pasta apagada e criada de novo. Registros da pasta antiga não são contados, então isso também pode remover uma linha que estaria aqui"
7996285e-8ccf-4b2d-8fec-339a32b95931:
  title: "O change journal tem uma renomeação na pasta asi do FiveM para GTA V Enhanced"
  description: >-
    O change journal do NTFS guarda pelo menos um registro de arquivo renomeado diretamente dentro da
    pasta asi do FiveM para GTA V Enhanced, movido para dentro dela ou para fora dela. Uma renomeação
    dentro da pasta deixa dois registros, um com o nome antigo e um com o novo. A linha dá quantos
    registros e a primeira e a última vez. Mostra o intervalo que o journal cobria: num PC comum em uso
    isso pode ser bem menos de uma hora. Nada antes desse intervalo é visto. Se esta regra não encontra
    nada, significa só que nada foi renomeado, movido para dentro ou para fora ali nesse intervalo. O
    journal não registra qual programa alterou um arquivo, então isto não diz quem fez nem que algo foi
    escondido. Não está estabelecido se o FiveM para GTA V Enhanced carrega algo desta pasta.
  retention: >-
    Só o intervalo que o change journal ainda guardava quando a verificação o leu, mostrado ao lado
    desta linha. O journal tem tamanho fixo e descarta primeiro os registros mais antigos; num PC com
    Windows 11 ele guardava cerca de 39 minutos.
  falsepositives:
    - "O jogador renomeou, moveu ou substituiu um mod gráfico, ReShade, ENB ou outro plugin que tinha instalado"
    - "Uma atualização que grava uma cópia nova de um arquivo e a troca por renomeação, feita pelo FiveM, seu atualizador ou um plugin (não medido para esta pasta)"
    - "Um arquivo movido para a Lixeira ou para outra pasta na mesma unidade, que o journal registra como renomeação (como a Lixeira aparece não foi medido)"
    - "Antivírus colocando um arquivo em quarentena"
    - "O FiveM reinstalado, ou a pasta apagada e criada de novo. Registros da pasta antiga não são contados, então isso também pode remover uma linha que estaria aqui"
91dc8b45-8355-4554-8a6d-e979e4a95ecd:
