id: 1d8680d3-8cf6-455b-82ef-f905009e6d47
title: "A browser extension can run user-supplied scripts"
description: >-
  An extension holds the userScripts permission (Tampermonkey, Violentmonkey and similar), so it can
  run JavaScript the user installs on matching pages. The scripts themselves are not read.
status: experimental
collector: browser_ext
strength: context
match:
  user_scripts: true
retention: >-
  Extensions installed in each browser profile at scan time.
unmeasured_when: [not_windows]
falsepositives:
  - "Userscripts for site tweaks, dark themes and accessibility, the common use of these managers"
references:
  - https://developer.chrome.com/docs/extensions/reference/permissions-list
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [browser]
level: info
category: browser_scripts
