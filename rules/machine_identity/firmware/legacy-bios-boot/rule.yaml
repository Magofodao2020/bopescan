id: d5f36166-0023-4b99-9334-333938feca9e
title: "Windows started through legacy BIOS, not UEFI"
description: >-
  Windows reports it started through legacy BIOS (or a UEFI compatibility module). Secure Boot needs
  UEFI, so it cannot be on. A setting, not evidence of cheating.
status: experimental
collector: machine_identity
strength: posture
match:
  firmware_type: "bios"
retention: >-
  How Windows started this time.
unmeasured_when: [not_windows]
falsepositives:
  - "Older PCs and installations made before switching the firmware to UEFI"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [firmware]
level: info
category: firmware_boot
