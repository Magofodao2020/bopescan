id: f8eb887a-cd84-4fdb-87fa-cd6bf548a847
title: "An unsigned program downloaded from the internet is in a user folder"
description: >-
  A program or DLL in Downloads, Desktop or Documents carries Windows' Mark of the Web for the
  Internet zone and has no embedded signature that verifies. Shown with its hash and, when the
  player agreed, the host it came from. Many ordinary downloads are unsigned.
status: experimental
collector: user_files
strength: context
match:
  kind: "program"
  zone_id: 3
  signature: ["no_embedded_signature", "invalid"]
retention: >-
  The files as they are at scan time.
unmeasured_when: [not_windows]
falsepositives:
  - "Mods, indie games, open-source tools and utilities, which are often unsigned"
references:
  - https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-fscc/6e3f7352-d11c-4d76-8c39-2516a9df36e8
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [download, motw]
level: info
category: files
