id: 51cd80d4-0a55-4900-9eee-6ad30958c99e
title: "An item named like a Roblox executor or injector is in the Recycle Bin"
description: >-
  This account's Recycle Bin holds an item whose original name matches a Roblox executor or
  injector. The row says where it was and when it was deleted, and whether its contents are still in
  the bin.
status: experimental
collector: roblox_files
strength: presence
match:
  scope: "recycled"
  tool_kind: ["executor", "injector"]
retention: >-
  Until the Recycle Bin is emptied.
falsepositives:
  - "A download deleted without being used; an unrelated file with the same name"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [roblox, deleted]
level: warn
category: files
