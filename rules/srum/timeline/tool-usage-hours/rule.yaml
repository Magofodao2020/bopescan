id: d600c6da-1da8-44b5-9e47-24c56cf01558
title: "Hours SRUM recorded programs named like Roblox tools"
description: >-
  Puts on the timeline the first and last hour the System Resource Usage Monitor recorded a program
  whose name matches the Roblox tool catalog.
status: experimental
role: timeline
collector: srum
strength: context
match:
  scope: "app"
  "tool_id|exists": true
retention: >-
  SRUM keeps about 30 to 60 days of hourly rows.
falsepositives:
  - "A time is the hour SRUM wrote its figures, not when the program started; a name does not identify a program"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [timeline, roblox]
category: execution
