id: 600821fa-4ec6-44b1-bb39-a324585c169f
title: "Times of a program whose name starts like a public Roblox executor's"
description: >-
  Puts on the timeline the times this source records for a program whose file name starts with the
  name of a publicly discussed Roblox executor. A file name is not an identity: anyone can name a
  file anything, and several of these names are ordinary words.
status: experimental
role: timeline
collector: userassist
strength: context
match:
  "name|startswith": ["Solara", "Xeno", "Celery", "Fluxus", "KRNL", "JJSploit", "Synapse", "Seliware", "Nihon", "Script-Ware"]
retention: >-
  Whatever this source still holds.
falsepositives:
  - "A file renamed or named this way for an unrelated reason; a name does not identify a program, and a missing time is not evidence of anything"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [timeline, roblox]
category: roblox
