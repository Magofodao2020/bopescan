id: edd66aa7-ee7e-4c79-89b3-201ccda5c4b1
title: "VPN or proxy software is installed"
description: >-
  Windows' list of installed programs holds one whose name puts it in the "vpn_proxy" group. The row
  shows its name, publisher, version and install date. Being installed says what the software can
  do, not what it was used for, and an uninstalled or portable copy leaves no entry here.
status: experimental
collector: installed_programs
strength: context
match:
  category: "vpn_proxy"
retention: >-
  Programs whose uninstall entry is still in the registry at scan time.
unmeasured_when: [not_windows]
falsepositives:
  - "Privacy, work VPNs, school networks and playing on servers in other regions"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [installed, vpn_proxy]
level: info
category: network
