id: 77316dfc-9588-441f-8c89-0c0ceeddb73c
title: "A mouse or keyboard suite that can store macros is installed"
description: >-
  Windows' list of installed programs holds one whose name puts it in the "peripheral_suite" group.
  The row shows its name, publisher, version and install date. Being installed says what the
  software can do, not what it was used for, and an uninstalled or portable copy leaves no entry
  here.
status: experimental
collector: installed_programs
strength: context
match:
  category: "peripheral_suite"
retention: >-
  Programs whose uninstall entry is still in the registry at scan time.
unmeasured_when: [not_windows]
falsepositives:
  - "Anyone who owns the brand's mouse or keyboard; macros are one feature among lighting and DPI settings"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [installed, peripheral_suite]
level: info
category: macros_peripherals
