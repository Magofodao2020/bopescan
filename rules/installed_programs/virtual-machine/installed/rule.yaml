id: 4ac0ac60-f04d-4da3-8c8c-3ede5dc4157d
title: "Virtual-machine or Android-emulator software is installed"
description: >-
  Windows' list of installed programs holds one whose name puts it in the "virtual_machine" group.
  The row shows its name, publisher, version and install date. Being installed says what the
  software can do, not what it was used for, and an uninstalled or portable copy leaves no entry
  here.
status: experimental
collector: installed_programs
strength: context
match:
  category: "virtual_machine"
retention: >-
  Programs whose uninstall entry is still in the registry at scan time.
unmeasured_when: [not_windows]
falsepositives:
  - "Development, testing, schoolwork and mobile games"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [installed, virtual_machine]
level: info
category: other
