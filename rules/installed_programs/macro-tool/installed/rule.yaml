id: 926dfea8-5be5-417c-b5f3-6feb2a6f0761
title: "A macro or auto-clicker tool is installed"
description: >-
  Windows' list of installed programs holds one whose name puts it in the "macro_tool" group. The
  row shows its name, publisher, version and install date. Being installed says what the software
  can do, not what it was used for, and an uninstalled or portable copy leaves no entry here.
status: experimental
collector: installed_programs
strength: context
match:
  category: "macro_tool"
retention: >-
  Programs whose uninstall entry is still in the registry at scan time.
unmeasured_when: [not_windows]
falsepositives:
  - "Productivity and accessibility automation, the common use of AutoHotkey and AutoIt"
author: B.O.P.E Scanner contributors
date: 2026-10-15
tags: [installed, macro_tool]
level: info
category: macros_peripherals
