[package]
name = "bope-cli"
description = "B.O.P.E Scanner command-line scanner (no WebView), a modified version of aeterna-rongroi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bope-scanner-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
jiff.workspace = true
serde_json.workspace = true
bope-collectors.workspace = true
bope-core.workspace = true
bope-host.workspace = true

[target.'cfg(windows)'.dependencies]
bope-host-windows.workspace = true

[dev-dependencies]
# The trace-ages text is checked against a scan of a fixture host (ADR 0061).
bope-host = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
