# Synthetic fixture host — see ../PROVENANCE.md.
#
# Traces of a Roblox executor that is no longer on the PC (B.O.P.E, ADR 0118–0123): UserAssist says
# Downloads\Fluxus\Fluxus.exe was started from Explorer twice; Amcache (from a shadow copy) inventoried
# it; a Recent shortcut points at it; the change journal recorded it being created and deleted, and the
# Recycle Bin still holds its folder's loader. The folder is gone. The Roblox player's FastFlag file sets a
# physics-sender flag. Every name, hash and time is invented; no real cheat file is described.
#
# B.O.P.E 0.10.0 (ADR 0124–0127): SRUM (from the same shadow copy) recorded CPU time for Fluxus.exe in the
# hour of 20:00; the Master File Table still holds the freed records of the Fluxus folder and Fluxus.exe;
# ShellBags remember Downloads\Fluxus and the Open dialog remembers picking Fluxus.exe; WMI holds only the
# subscription Windows ships. `SRUDB.dat` and `volume-c.img` are written by
# `cargo run -p bope-parsers --example synthetic_fixtures`.
