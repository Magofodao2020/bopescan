# Synthetic fixture host — see ../PROVENANCE.md.
#
# A baseline (ADR 0017): this host asserts "a machine like this is unremarkable", and
# `cargo xtask check-baseline` requires the whole rule set to stay quiet on it, apart from the rows
# `rules/known-fps.csv` accepts for this baseline.
#
# Profile (B.O.P.E, ADR 0101): the ordinary Windows 11 PC of somebody who plays Roblox, scanned elevated
# with a full scan. Roblox is installed per user with a signed player and signed DLL, an empty
# ClientAppSettings.json, and logs; Bloxstrap is installed, as it is for a large share of players. The
# player is running and its anti-cheat refuses the module and memory reads, which is what a protected
# process does on every ordinary PC. Explorer's lists hold ordinary programs; a signed installer runs from
# Downloads; the user keeps a Roblox Studio module script and a Python homework script in Documents; Chrome
# has an ad blocker; a Logitech mouse and a USB hub are the only USB devices; Python and Logitech G HUB are
# installed. Every value is invented for this profile; hashes and certificate hashes are placeholders.
#
# The shapes a careless rule would fire on are here on purpose: a program run from Downloads, a Lua file,
# a .py file, an extension with access to every site, a peripheral suite that can store macros.
#
# B.O.P.E 0.10.0 (ADR 0124–0127): SRUM (from a shadow copy) holds the Roblox player, Bloxstrap and Explorer; the
# Master File Table holds the Roblox and Bloxstrap folders and the freed record of Bloxstrap's deleted
# installer; ShellBags remember Documents and the Bloxstrap folder, and the Open dialog the installer; WMI holds
# only the subscription Windows ships. `SRUDB.dat` and `volume-c.img` are written by
# `cargo run -p bope-parsers --example synthetic_fixtures`.
