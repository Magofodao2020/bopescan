# image mapped by hand); an image mapping the loader does not list; and a heap region with a FastFlag
# JSON object, executor function names, an injection API name, a DLL path and one line of chat text.
# A second player instance refuses the read, as Roblox's anti-cheat does. Every image is the one
# synthetic module.dll (cargo run -p bope-parsers --example synthetic_fixtures); nothing is a real
# program, account or message.
