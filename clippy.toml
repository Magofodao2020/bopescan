# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Offline by design (AGENTS.md hard rule 1). cargo-deny bans network crates; this bans the standard library's.
disallowed-types = [
  { path = "std::net::TcpStream", reason = "aeterna-rongroi has no network code" },
  { path = "std::net::TcpListener", reason = "aeterna-rongroi has no network code" },
  { path = "std::net::UdpSocket", reason = "aeterna-rongroi has no network code" },
]

# ADR 0038: reading the UEFI Secure Boot variable enables SeSystemEnvironmentPrivilege in this program's own token
# for one read. The same privilege lets a process write firmware variables, which no gate would otherwise notice,
# so the write calls are banned outright (AGENTS.md hard rule 2).
# ADR 0047: `DeviceIoControl` sends `FSCTL_DELETE_USN_JOURNAL` as readily as `FSCTL_READ_USN_JOURNAL`, and a
# wrong constant is invisible in review. It is called in one function, `usn_journal::live::control`, which
# accepts only the two read codes and carries the one `#[allow]`. `CreateFileW` opens for writing and creates files
# as readily as it opens for reading; it is called in one function, `usn_journal::live::open`, which accepts only
# `GENERIC_READ` or `FILE_READ_ATTRIBUTES` on an existing path and carries the one `#[allow]`.
disallowed-methods = [
  { path = "windows::Win32::System::WindowsProgramming::SetFirmwareEnvironmentVariableA", reason = "collectors are read-only; ADR 0038 allows reading firmware variables, never writing them" },
  { path = "windows::Win32::System::WindowsProgramming::SetFirmwareEnvironmentVariableW", reason = "collectors are read-only; ADR 0038 allows reading firmware variables, never writing them" },
  { path = "windows::Win32::System::WindowsProgramming::SetFirmwareEnvironmentVariableExA", reason = "collectors are read-only; ADR 0038 allows reading firmware variables, never writing them" },
  { path = "windows::Win32::System::WindowsProgramming::SetFirmwareEnvironmentVariableExW", reason = "collectors are read-only; ADR 0038 allows reading firmware variables, never writing them" },
  { path = "windows::Win32::System::IO::DeviceIoControl", reason = "collectors are read-only; ADR 0047 allows only the two change-journal read codes, through usn_journal::live::control" },
  { path = "windows::Win32::Storage::FileSystem::CreateFileW", reason = "collectors are read-only; ADR 0047 opens a volume or folder only with GENERIC_READ or FILE_READ_ATTRIBUTES, through usn_journal::live::open" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpOpen", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpConnect", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpOpenRequest", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpSendRequest", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpReceiveResponse", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpQueryHeaders", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpQueryDataAvailable", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpReadData", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpSetOption", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpSetTimeouts", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
  { path = "windows::Win32::Networking::WinHttp::WinHttpCloseHandle", reason = "B.O.P.E ADR 0136: the one network call is bope_host_windows::https_get, to two GitHub hosts, for the FastFlag reference only" },
]
